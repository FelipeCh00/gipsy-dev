<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Gipsy Dev emblem</title>
  <defs>
    <clipPath id="helmet">
      <path d="M256 92 L346 128 L388 214 L378 318 L322 398 L256 424 L190 398 L134 318 L124 214 L166 128 Z"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <g clip-path="url(#helmet)">
    <!-- lower mask -->
    <rect x="0" y="0" width="512" height="512" fill="#2B313B"/>
    <!-- upper armor plate -->
    <rect x="0" y="0" width="512" height="238" fill="#E8E6E1"/>
    <!-- headband -->
    <rect x="0" y="168" width="512" height="22" fill="#2B313B"/>
    <!-- center seam -->
    <rect x="252" y="80" width="8" height="88" fill="#0B0D11"/>
    <!-- visor -->
    <rect x="0" y="238" width="512" height="34" fill="#0B0D11"/>
    <!-- cheek seams -->
    <path d="M150 272 L222 404 M362 272 L290 404" stroke="#0B0D11" stroke-width="5" fill="none"/>
    <!-- vents -->
    <path d="M220 308 H292 M228 330 H284 M236 352 H276" stroke="#0B0D11" stroke-width="7" fill="none"/>
  </g>

  <!-- eye slit -->
  <path d="M164 248 L348 248 L330 261 L182 261 Z" fill="#FF3B1F" filter="url(#glow)" opacity="0.55"/>
  <path d="M164 248 L348 248 L330 261 L182 261 Z" fill="#FF3B1F"/>
</svg>
